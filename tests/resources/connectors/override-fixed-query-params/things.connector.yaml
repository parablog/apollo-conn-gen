{
  "config": {
    "schema": "generated-at-test-time.graphql"
  },
  "tests": [
    {
      "name": "no-arguments",
      "connector": "Query.things",
      "variables": { "args": {} },
      "apiResponseBody": "{\"name\": \"Rex\"}",
      "expect": {
        "connectorRequest": {
          "url": "https://example.com/things?api-version=2024-01&api-release=2024-01",
          "method": "GET"
        }
      }
    },
    {
      "name": "page-supplied",
      "connector": "Query.things",
      "variables": { "args": { "page": 3 } },
      "apiResponseBody": "{\"name\": \"Rex\"}",
      "expect": {
        "connectorRequest": {
          "url": "https://example.com/things?page=3&page-dollar=3&page-fallback=3&api-version=2024-01&api-release=2024-01",
          "method": "GET"
        }
      }
    }
  ]
}
