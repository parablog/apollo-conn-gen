openapi: 3.0.0
info:
  title: a single-member allOf wrapping a scalar-only oneOf vanishes
  version: "1.0"
paths:
  /assessments:
    get:
      operationId: getAssessments
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  value:
                    allOf:
                      - $ref: "#/components/schemas/MixedValue"
components:
  schemas:
    MixedValue:
      oneOf:
        - type: string
        - type: number
        - type: boolean
