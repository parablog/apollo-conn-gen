openapi: 3.0.0
info:
  title: merge-patch content-type test
  version: "1.0"
paths:
  /widgets/{id}:
    patch:
      operationId: updateWidget
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          # RFC 7396 merge-patch -- conformant servers enforce this by content-type, not JSON alone
          application/merge-patch+json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
