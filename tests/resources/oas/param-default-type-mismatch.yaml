openapi: 3.0.0
info:
  title: param default type mismatch (#127)
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - name: count
          in: query
          required: false
          schema:
            type: string
            pattern: '^-?\d*\.?\d+$'
            default: 100
        - name: fully_resolved
          in: query
          required: false
          schema:
            type: string
            default: false
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
