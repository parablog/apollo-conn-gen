openapi: 3.0.3
info:
  title: Empty composed map value
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /containers:
    get:
      operationId: getContainer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Container'
components:
  schemas:
    Container:
      type: object
      properties:
        name:
          type: string
        exposedPorts:
          type: object
          additionalProperties:
            type: object
        mergedPorts:
          type: object
          additionalProperties:
            allOf:
              - type: object
              - type: object
