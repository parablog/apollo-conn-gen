openapi: "3.0.1"
info:
  title: Paginated list of a polymorphic item (union nested under a named field)
  version: "1.0.0"
paths:
  # a discriminated union nested inside a named array field — the shape every paginated-list REST
  # API produces (e.g. launch library's PaginatedAgencyList.results: [oneOf [...]]). Real unions
  # compose fine when they're the op's own response, but rover won't resolve any field of a
  # `->match` reached through a wrapping property. see docs/FIXED.md #38
  /list:
    get:
      summary: A paginated list whose items are a discriminated union.
      responses:
        '200':
          description: A page of items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemUnion'
  # the SAME union, but as the op's own bare response — this must stay a real union.
  /items:
    get:
      summary: The same union, returned directly (not nested).
      responses:
        '200':
          description: A page of items, unwrapped.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemUnion'
  # an inline (non-$ref) discriminated union, nested the same way as /list — has no name to
  # propagate a merge decision by, so it can only be fixed by the per-instance check.
  /inline-list:
    get:
      summary: A paginated list of an inline (unnamed) discriminated union.
      responses:
        '200':
          description: A page of items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      discriminator:
                        propertyName: type
                      oneOf:
                        - type: object
                          properties:
                            type:
                              type: string
                            a:
                              type: string
                        - type: object
                          properties:
                            type:
                              type: string
                            b:
                              type: string
  # the same real-union shape as /items, but with snake_case component refs — the union's member
  # list and __typename must resolve the same sanitised (PascalCase) name the member's own `type`
  # definition uses, not the raw ref. see docs/FIXED.md #43
  /snake-items:
    get:
      summary: A real union whose member refs are snake_case, not PascalCase.
      responses:
        '200':
          description: A page of items, unwrapped.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/snake_item_union'
  # StatusEnumKind and StatusStringKind both have a "status" field but of incompatible KINDS (enum
  # vs plain string) — not just different targets of the same kind (that's /wrapped-list, #39).
  # Must degrade to the untyped JSON scalar fallback, not silently keep one kind and drop the
  # other. see docs/FIXED.md #44
  /kind-collision-list:
    get:
      summary: A nested union whose members share a field name of incompatible kinds.
      responses:
        '200':
          description: A page of items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/KindCollisionUnion'
  # WrappedBasic and WrappedRich both have a "detail" field but point at different types — only
  # the first is kept, the other must not leak into the schema. see docs/FIXED.md #39
  /wrapped-list:
    get:
      summary: A nested union whose members share a field name pointing at different types.
      responses:
        '200':
          description: A page of items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/WrappedUnion'
components:
  schemas:
    WrappedUnion:
      discriminator:
        propertyName: type
        mapping:
          basic: '#/components/schemas/WrappedBasic'
          rich: '#/components/schemas/WrappedRich'
      oneOf:
        - $ref: '#/components/schemas/WrappedBasic'
        - $ref: '#/components/schemas/WrappedRich'
    WrappedBasic:
      type: object
      properties:
        type:
          type: string
        detail:
          $ref: '#/components/schemas/DetailBasic'
    WrappedRich:
      type: object
      properties:
        type:
          type: string
        detail:
          $ref: '#/components/schemas/DetailRich'
    DetailBasic:
      type: object
      properties:
        summary:
          type: string
    DetailRich:
      type: object
      properties:
        summary:
          type: string
        deep:
          $ref: '#/components/schemas/DeepThing'
    DeepThing:
      type: object
      properties:
        value:
          type: string
    ItemUnion:
      discriminator:
        propertyName: type
        mapping:
          book: '#/components/schemas/Book'
          movie: '#/components/schemas/Movie'
      oneOf:
        - $ref: '#/components/schemas/Book'
        - $ref: '#/components/schemas/Movie'
    Book:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        author:
          type: string
    Movie:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        director:
          type: string
    snake_item_union:
      discriminator:
        propertyName: type
        mapping:
          book_item: '#/components/schemas/book_item'
          movie_item: '#/components/schemas/movie_item'
      oneOf:
        - $ref: '#/components/schemas/book_item'
        - $ref: '#/components/schemas/movie_item'
    book_item:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
    movie_item:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
    KindCollisionUnion:
      discriminator:
        propertyName: type
        mapping:
          enumKind: '#/components/schemas/StatusEnumKind'
          stringKind: '#/components/schemas/StatusStringKind'
      oneOf:
        - $ref: '#/components/schemas/StatusEnumKind'
        - $ref: '#/components/schemas/StatusStringKind'
    StatusEnumKind:
      type: object
      properties:
        type:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
    StatusEnum:
      type: string
      enum:
        - active
        - inactive
    StatusStringKind:
      type: object
      properties:
        type:
          type: string
        status:
          type: string
