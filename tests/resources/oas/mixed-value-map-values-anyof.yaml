openapi: 3.0.0
info:
  title: mixed anyOf as map values (deliberate oneOf/anyOf symmetry at this position)
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /byKey.get:
    get:
      operationId: getByKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  byKey:
                    type: object
                    additionalProperties:
                      anyOf:
                        - type: boolean
                          title: Boolean
                        - type: object
                          title: Currency
                          properties:
                            value:
                              type: number
                            currencyCode:
                              type: string
                        - type: string
                          title: Date
                          format: date-time
