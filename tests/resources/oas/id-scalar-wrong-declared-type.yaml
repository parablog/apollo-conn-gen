openapi: 3.0.0
info:
  title: id scalar wrong declared type test
  version: "1.0"
paths:
  /worlds/{id}:
    get:
      operationId: readWorld
      parameters:
        - name: id
          in: path
          required: true
          # Self-contradictory, but real (World Anvil's Boromir v2 spec does exactly this): the
          # declared type is integer, but format: uuid means the real API actually returns a UUID
          # string. Example real response: {"id": "3f2b1c0a-...", "title": "Aerdyth"}
          schema: { type: integer, format: uuid }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldReference'
components:
  schemas:
    WorldReference:
      type: object
      properties:
        id: { type: integer, format: uuid }
        ownerId: { type: integer, format: uuid }
        verifiedId: { type: boolean }
        rankId: { type: number }
        title: { type: string }
