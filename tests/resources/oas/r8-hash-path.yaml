openapi: 3.0.3
info:
  title: Hash Sub-Resource Service
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  # Box-style hash path: `#` stays in the HTTP path but must be split out of the GraphQL field name.
  /items#weblinks:
    get:
      operationId: listItemsWeblinks
      summary: List weblinks via a hash sub-resource path
      responses:
        '200':
          description: A list of weblinks
          content:
            application/json:
              schema:
                type: object
                properties:
                  weblinks:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebLink'
  /items/{item_id}#get_shared_link:
    get:
      operationId: getItemSharedLink
      summary: Get a shared link for an item via a hash sub-resource path
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A shared link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedLink'
components:
  schemas:
    WebLink:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
    SharedLink:
      type: object
      properties:
        url:
          type: string
        access:
          type: string
