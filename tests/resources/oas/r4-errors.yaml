openapi: 3.0.3
info:
  title: R4 Errors Service
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A widget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        # numeric error responses -> op opts into errors emission
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /gadgets:
    get:
      operationId: listGadgets
      responses:
        '200':
          description: Gadgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Widget'
        # OAS range keys -> must also opt into errors emission
        '4XX':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '5XX':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health:
    get:
      operationId: getHealth
      # 200 only -> never gets an errors block
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
  /legacy:
    get:
      operationId: getLegacy
      # both error shapes document only `error` -> message falls back to it
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
  /mixed:
    get:
      operationId: getMixed
      # 404 has `message`, 500 has only `code` -> no field common to all shapes, no message
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeOnlyError'
components:
  schemas:
    Widget:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
    LegacyError:
      type: object
      properties:
        error:
          type: string
    CodeOnlyError:
      type: object
      properties:
        code:
          type: string
