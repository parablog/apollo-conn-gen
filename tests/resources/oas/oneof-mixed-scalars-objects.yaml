openapi: 3.0.0
info:
  title: oneOf scalars+objects, list member, inline object members (Ashby CustomField.value shape)
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /customField.list:
    get:
      operationId: listCustomFields
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    description: The value of the custom field
                    nullable: true
                    oneOf:
                      - type: boolean
                      - type: number
                      - type: string
                      - type: array
                        items:
                          type: string
                      - type: object
                        properties:
                          value:
                            type: number
                            description: The currency amount
                          currencyCode:
                            type: string
                            description: The currency code
                        required: [value, currencyCode]
                      - type: object
                        properties:
                          country:
                            type: string
                            description: The country of the location
                          region:
                            type: string
                            description: The region of the location
                          city:
                            type: string
                            description: The city of the location
