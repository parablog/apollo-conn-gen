openapi: 3.0.0
info:
  title: Strip JSON diagnostics
  version: 1.0.0
servers:
  - url: http://localhost:9000
paths:
  /things:
    get:
      operationId: listThings
      summary: List things
      parameters:
        - name: filter
          in: query
          schema:
            # no type/oneOf/allOf/properties: the catch-all JSON fallback + argument-form note
            example: anything
      responses:
        '200':
          description: things
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Thing' }
  /things/{thing_id}:
    get:
      operationId: getThing
      summary: Get a thing
      parameters:
        - name: thing_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: one thing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thing' }
components:
  schemas:
    Thing:
      type: object
      properties:
        thing_id: { type: integer }
        blob:
          description: An opaque blob.
          anyOf:
            - type: string
            - type: integer
            - type: number
        bare_blob:
          # no description: the note becomes the field's whole single-line docstring
          anyOf:
            - type: string
            - type: integer
            - type: number
        literal_note:
          # the author's own text already contains "NEEDS ATTENTION:" -- must survive skipDegradeReasons verbatim
          description: 'Author note: NEEDS ATTENTION: check this value by hand.'
          anyOf:
            - type: string
            - type: integer
            - type: number
        em_dash:
          # the author's own text carries a real em-dash (U+2014) -- normalised to "--" either way
          description: 'Uses an em—dash in its own text.'
          anyOf:
            - type: string
            - type: integer
            - type: number
