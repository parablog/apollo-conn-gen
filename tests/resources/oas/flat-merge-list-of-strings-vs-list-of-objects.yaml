openapi: 3.0.0
info:
  title: a flat merge whose two objects disagree on a list field's item shape
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /party.get:
    get:
      operationId: getParty
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  party:
                    oneOf:
                      - type: object
                        title: Individual
                        properties:
                          tags:
                            type: array
                            items:
                              type: string
                      - type: object
                        title: Organization
                        properties:
                          tags:
                            type: array
                            items:
                              type: object
                              properties:
                                label:
                                  type: string
