openapi: 3.0.1
info:
  title: Car Configurator Service (CCS) INT
  description: "This document describes CCS's REST API Interface, in which the Endpoints\
    \ are structured based on their use cases: Offering vs. Ordering. \n\n [CoDE_Q\
    \ Use-Case Workflow Documentation Page](https://social.cloud.corpintra.net/docs/DOC-467506)\
    \ \n\n [Confidential Data Documentation Page](https://pages.git.i.mercedes-benz.com/CarConfigurator/CarIM/faq/)"
  termsOfService: ""
  contact:
    name: CoDE_Q
    email: code_q@mercedes-benz.com
  version: 10.210.0
  x-environment: int
servers:
- url: https://int.pmd-ccs.nonprod.ce.cloud.corpintra.net/ccs-gw
  description: Generated server url
security:
- ApiKeyAuthentication: []
paths:
  /api/v1/onlinecode:
    post:
      tags:
      - Offering - Onlinecode
      summary: Store the vehicle configuration of the given vehicleId in the Vehicle
        Configuration Store (VCS).
      description: Store the vehicle of the given `vehicleId`.
      operationId: storeVehicleConfiguration
      parameters:
      - name: Login-State
        in: header
        required: false
        schema:
          type: string
          enum:
          - CUSTOMER
          - EMPLOYEE
      - name: Parent-Vcs-Id
        in: header
        description: The Parent VCS Id to link the stored configuration
        required: false
        schema:
          type: string
      - name: Parent-Online-Code
        in: header
        description: The Parent Online Code to link the stored configuration
        required: false
        schema:
          type: string
      - name: configurationDate
        in: query
        description: "Specifies the date on which a configuration has to be valid\
          \ (format: 'YYYY-MM-DD', e.g. '2024-02-14'). Attention: date is treated\
          \ as UTC date."
        required: false
        schema:
          type: string
          format: date
      - name: overrideSystemDate
        in: query
        description: "Specifies the virtual system date for KBV based vehicles (format:\
          \ 'YYYY-MM-DD', e.g. '2023-02-14'). Attention: date is treated as UTC date.\
          \ Only available when using CONFIDENTIAL view and corresponding access rights."
        required: false
        schema:
          type: string
          format: date
      - name: salesLevel
        in: query
        description: |
          Restricts the configurations to a certain sales level.

          |parameter|Description|
          |---|---|
          |INTERNET|Show configurations available on the internet (default)|
          |RETAIL|Show configurations available for retailers only|
          |WHOLESALE|Show configurations available for wholesalers only|
        required: false
        schema:
          type: string
          enum:
          - INTERNET
          - RETAIL
          - WHOLESALE
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreVehicleConfigurationRequest"
            example:
              vehicleId: ""
        required: true
      responses:
        "400":
          description: VehicleId is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Access is forbidden for requested market or sales level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Vehicle or Configuration has not been found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: A system error has occurred. Details can be found in the error
            message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineCodeResponse"
  /api/v1/vehicles/{vehicleId}:
    get:
      tags:
      - Offering - Healing
      summary: Retrieve the (possibly healed) vehicle of the given vehicleId.
      description: "Retrieve the vehicle of the given `vehicleId`. If the configuration\
        \ was invalid or incomplete, an automatic healing from the kernel is done.\
        \ The kernel will always return a valid configuration!"
      operationId: getVehicles
      parameters:
      - name: vehicleId
        in: path
        description: Minimal string that identifies a vehicle e.g. 'de_DE__1770871__AU-311_GC-429_LE-L_LU-696_MJ-806_PC-PBG-PSA-U59-U62_SA-00U-01U-02B-213-218-243-258-270-286-287-294-310-345-351-355-362-365-367-428-43R-475-504-521-537-543-580-58U-5B0-620-677-679-70B-72B-73B-79B-7U2-859-873-88B-927-969-986-B01-B51-B59-L3E-R05-U01-U10-U12-U54-U60_SC-0B2-0K2-0S3-0U1-1B3-1U5-2S2-2U1-2U8-3S6-4S6-502-51B-6P5-6U0-7B4-8P3-8S8-8U6-8U8-98B-998-9U8-B09-B10-K13-K31-K37-K45-PVN-PXV-R7A-V08'.
        required: true
        schema:
          pattern: "^[a-zA-Z]{2}_[a-zA-Z]{2}(-[a-zA-Z0-9]{2,3})?__[0-9]{6,8}(?:\\\
            +[A-Z0-9]{3})*(?:_[A-Z0-9]+)?(_[0-9A-Z]{3,4})?__(((([a-zA-Z0-9]{1,2}(-[a-zA-Z0-9#]{1,10})+)){1})(_([a-zA-Z0-9]{1,2}(-[a-zA-Z0-9#]{1,10})+)){0,})$"
          type: string
      - name: views
        in: query
        description: |-
          Specifies what kind of additional data should be returned. The data views are separated from each other by a comma.

          |parameter|Description|
          |---|---|
          |IDS|View with component IDS for configuration|
          |TECH|Data view of technical information of a vehicle|
          |MULTI_DESC|View with detailed component descriptions|
          |MEDIA|Media (images) view for configuration|
          |CONFIDENTIAL|Data view to fetch confidential vehicles based on configuration date - [View More](https://pages.git.i.mercedes-benz.com/CarConfigurator/CarIM/faq/)|
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - IDS
            - TECH
            - MULTI_DESC
            - MEDIA
            - CONFIDENTIAL
      - name: configurationDate
        in: query
        description: "Specifies the date on which a configuration has to be valid\
          \ (format: 'YYYY-MM-DD', e.g. '2024-02-14'). Attention: date is treated\
          \ as UTC date."
        required: false
        schema:
          type: string
          format: date
      - name: pricingDate
        in: query
        description: "Specifies the pricing date of the configuration (format: 'YYYY-MM-DD',\
          \ e.g. '2024-02-14'). Attention: date is treated as UTC date."
        required: false
        schema:
          type: string
          format: date
      - name: overrideSystemDate
        in: query
        description: "Specifies the virtual system date for KBV based vehicles (format:\
          \ 'YYYY-MM-DD', e.g. '2023-02-14'). Attention: date is treated as UTC date.\
          \ Only available when using CONFIDENTIAL view and corresponding access rights."
        required: false
        schema:
          type: string
          format: date
      - name: salesLevel
        in: query
        description: |
          Restricts the configurations to a certain sales level.

          |parameter|Description|
          |---|---|
          |INTERNET|Show configurations available on the internet (default)|
          |RETAIL|Show configurations available for retailers only|
          |WHOLESALE|Show configurations available for wholesalers only|
        required: false
        schema:
          type: string
          enum:
          - INTERNET
          - RETAIL
          - WHOLESALE
      - name: notation
        in: query
        description: |
          **(Beta)** The code notation to be used. Applies only to output parameters.


          **Important note:** Parameters in this category are still work in progress and not final yet. Breaking changes will NOT be announced in advance.
          |parameter|Notation|
          |---|---|
          |KERNEL| Use the notation for code and code type as provided by the C2/GCC/KBV (default)|
          |DIALOG| Use the dialog notation.
        required: true
        schema:
          type: string
          enum:
          - KERNEL
          - DIALOG
      - name: zipCode
        in: query
        description: The zip code is needed in Australia (e.g. 2000) and Malaysia
          (e.g. 50000) to calculate taxes and prices.
        required: false
        schema:
          pattern: "[0-9]{2,}"
          type: string
      - name: vehicleHealing
        in: query
        description: "Once set to false, an invalid vehicleId will not be healed and\
          \ returns an error."
        required: false
        schema:
          type: boolean
      - name: gcApprovalNumber
        in: query
        description: Comma seperated list of values. Used in conjunctions with `TECH`
          view in order to properly calculate WLTP values for VANs. Please note that
          this parameter only has an effect on VANs.
        required: false
        schema:
          type: string
      responses:
        "403":
          description: Access is forbidden for requested market or sales level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: A system error has occurred. Details can be found in the error
            message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: VehicleId not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: VehicleId has not been found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/vehicles/{vehicleId}/alternatives:
    get:
      tags:
      - Offering - Configuration
