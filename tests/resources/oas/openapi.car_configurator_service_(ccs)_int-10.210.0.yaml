  /api/v1/markets/{marketId}/models/{modelId}/configurations/{configurationId}/alternatives/{componentList}:
    get:
      tags:
      - Offering - Configuration
      summary: "Get the alternative configurations for the given marketId, modelId,\
        \ configurationId and the componentList that has to be changed."
      description: "Get the alternative VehicleConfigurations for the given `marketId`,\
        \ `modelId`, `configurationId` and the `componentList` that has to be changed."
      operationId: getAlternatives
      parameters:
      - name: marketId
        in: path
        description: "Combination of language and country e.g 'de_DE', 'en_AE-AZ'\
          \ or 'en_PS-GZA'"
        required: true
        schema:
          pattern: "^[a-zA-Z]{2}_[a-zA-Z]{2}(-[a-zA-Z0-9]{2,3})?$"
          type: string
        example: de_DE
      - name: modelId
        in: path
        description: "Minimal string that identifies a model e.g. '1770871'. If no\
          \ nationalSalesType is available, the modelId only consists of the baumuster\
          \ e.g. '1770871'."
        required: true
        schema:
          pattern: "^[0-9]{6,8}(?:\\+[A-Z0-9]{3})*(?:_[A-Z0-9]+)?(_[0-9A-Z]{3,4})?$"
          type: string
        example: 1770871
      - name: configurationId
        in: path
        description: Minimal string that identifies a configuration e.g. 'AU-311_GC-429_LE-L_LU-696_MJ-806_PC-PBG-PSA-U59-U62_SA-00U-01U-02B-213-218-243-258-270-286-287-294-310-345-351-355-362-365-367-428-43R-475-504-521-537-543-580-58U-5B0-620-677-679-70B-72B-73B-79B-7U2-859-873-88B-927-969-986-B01-B51-B59-L3E-R05-U01-U10-U12-U54-U60_SC-0B2-0K2-0S3-0U1-1B3-1U5-2S2-2U1-2U8-3S6-4S6-502-51B-6P5-6U0-7B4-8P3-8S8-8U6-8U8-98B-998-9U8-B09-B10-K13-K31-K37-K45-PVN-PXV-R7A-V08'.
        required: true
        schema:
          pattern: "^(((([a-zA-Z0-9]{1,2}(-[a-zA-Z0-9#]{1,10})+)){1})(_([a-zA-Z0-9]{1,2}(-[a-zA-Z0-9#]{1,10})+)){0,})$"
          type: string
      - name: componentList
        in: path
        description: "A string representing the changes, in other words a list of\
          \ components that will be added and removed. The following syntax is used\
          \ for the components to be added and the components to be removed. The added\
          \ components e.g. '+PC-950_L-890' and the removed components e.g. '-I-953_L-696'\
          \ and the delimiter between the added and removed components is ','. In\
          \ one components string '+PC-950_L-890,-I-953_L-696'."
        required: true
        schema:
          pattern: "^([\\+\\-]{1}(((([a-zA-Z0-9]{1,2}(-[a-zA-Z0-9#]{1,10})+)){1})(_([a-zA-Z0-9]{1,2}(-[a-zA-Z0-9#]{1,10})+)){0,})(,)?)+$"
          type: string
        example: +PC-950
      - name: views
        in: query
        description: |-
          Specifies what kind of additional data should be returned. The data views are separated from each other by a comma.

          |parameter|Description|
          |---|---|
          |MULTI_DESC|View with detailed component descriptions|
          |CONFIDENTIAL|Data view to fetch confidential vehicles based on configuration date - [View More](https://pages.git.i.mercedes-benz.com/CarConfigurator/CarIM/faq/)|
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - MULTI_DESC
            - CONFIDENTIAL
      - name: maxAlternatives
        in: query
        description: Specifies the maximum number of alternatives to return (valid
          range is from 1 to 20).
        required: false
        schema:
          maximum: 20
          minimum: 1
          type: integer
          format: int32
      - name: fixedComponents
        in: query
        description: A list of components that are fixed (and cannot be removed) during
          this operation. The syntax looks like 'S-L12S' for a single component or
          '0-LG2_S-L12S' for a list of components. This feature is currently available
          for Vans only
        required: false
        schema:
          pattern: "^(((([a-zA-Z0-9]{1,2}(-[a-zA-Z0-9#]{1,10})+)){1})(_([a-zA-Z0-9]{1,2}(-[a-zA-Z0-9#]{1,10})+)){0,})$"
          type: string
      - name: configurationDate
        in: query
        description: "Specifies the date on which a configuration has to be valid\
          \ (format: 'YYYY-MM-DD', e.g. '2024-02-14'). Attention: date is treated\
          \ as UTC date."
        required: false
        schema:
          type: string
          format: date
      - name: pricingDate
        in: query
        description: "Specifies the pricing date of the configuration (format: 'YYYY-MM-DD',\
          \ e.g. '2024-02-14'). Attention: date is treated as UTC date."
        required: false
        schema:
          type: string
          format: date
      - name: overrideSystemDate
        in: query
        description: "Specifies the virtual system date for KBV based vehicles (format:\
          \ 'YYYY-MM-DD', e.g. '2023-02-14'). Attention: date is treated as UTC date.\
          \ Only available when using CONFIDENTIAL view and corresponding access rights."
        required: false
        schema:
          type: string
          format: date
      - name: salesLevel
        in: query
        description: |
          Restricts the configurations to a certain sales level.

          |parameter|Description|
          |---|---|
          |INTERNET|Show configurations available on the internet (default)|
          |RETAIL|Show configurations available for retailers only|
          |WHOLESALE|Show configurations available for wholesalers only|
        required: false
        schema:
          type: string
          enum:
          - INTERNET
          - RETAIL
          - WHOLESALE
      - name: checkBuildability
        in: query
        description: Check if the alternative is buildable by the kernel. Currently
          only available for Vans (KBV).
        required: false
        schema:
          type: boolean
      - name: notation
        in: query
        description: |
          **(Beta)** The code notation to be used. Applies only to output parameters.


          **Important note:** Parameters in this category are still work in progress and not final yet. Breaking changes will NOT be announced in advance.
          |parameter|Notation|
          |---|---|
          |KERNEL| Use the notation for code and code type as provided by the C2/GCC/KBV (default)|
          |DIALOG| Use the dialog notation.
        required: false
        schema:
          type: string
          enum:
          - KERNEL
          - DIALOG
      responses:
        "403":
          description: Access is forbidden for requested market or sales level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: A system error has occurred. Details can be found in the error
            message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Market, one of the Models or Configuration have not been found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleAlternative"
        "400":
          description: "MarketId, ModelId, ConfigurationId or ComponentList is not\
            \ valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
