      - name: notation
        in: query
        description: |
          **(Beta)** The code notation to be used. Applies only to output parameters.


          **Important note:** Parameters in this category are still work in progress and not final yet. Breaking changes will NOT be announced in advance.
          |parameter|Notation|
          |---|---|
