          \ as UTC date."
        required: false
        schema:
          type: string
          format: date
      - name: overrideSystemDate
        in: query
        description: "Specifies the virtual system date for KBV based vehicles (format:\
          \ 'YYYY-MM-DD', e.g. '2023-02-14'). Attention: date is treated as UTC date.\
          \ Only available when using CONFIDENTIAL view and corresponding access rights."
        required: false
        schema:
          type: string
