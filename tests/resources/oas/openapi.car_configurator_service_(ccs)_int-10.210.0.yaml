  /api/v1/market/{marketId}/costs/envkv:
    get:
      tags:
      - Vehicle Cost Calculation
      summary: Calculates Energieverbrauchskennzeichnungsverordnung (EnVKV) costs
        of a vehicle.
      description: "Calculates Energieverbrauchskennzeichnungsverordnung (EnVKV) costs\
        \ of a vehicle. Currently supported markets: DE, DE-FA"
      operationId: costCalculation
      parameters:
      - name: marketId
        in: path
        description: Market
        required: true
        schema:
          pattern: "^[a-zA-Z]{2}_[a-zA-Z]{2}(-[a-zA-Z0-9]{2,3})?$"
          type: string
        example: de_DE
      - name: combinedGasConsumption
        in: query
        description: Combined consumption for 100km in l/100km. Only relevant for
          Combuster and Plugin-Hybrid.
        required: false
        schema:
          type: number
          format: double
        example: 5.2
      - name: combinedElectricConsumption
        in: query
        description: Combined consumption for 100km in KwH/100km. Only relevant for
          BEV and Plugin-Hybrid.
        required: false
        schema:
          type: number
          format: double
      - name: combinedCo2emission
        in: query
        description: "Combined Co2 emission in g/km for ELECTRIC and COMBUSTER vehicles.\
          \ Weighted, combined Co2 emission for HYBRID vehicles."
        required: true
        schema:
          minimum: 0
          type: number
          format: double
        example: 137
      - name: engineCapacity
        in: query
        description: Capacity of engine (Hubraum) in ccm3. This is only relevant for
          COMBUSTER and HYBRID vehicles.
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
        example: 1993
      - name: fuelType
        in: query
        description: Fuel Type.
        required: true
        schema:
          $ref: "#/components/schemas/CostFuelType"
        example: DIESEL
      - name: engineConcept
        in: query
        description: engine concept
        required: true
        schema:
          $ref: "#/components/schemas/CostEngineConcept"
        example: COMBUSTOR
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnVKVResponse"
      deprecated: true
components:
  schemas:
    StoreVehicleConfigurationRequest:
      required:
      - vehicleId
      type: object
      properties:
        vehicleId:
          pattern: "^[a-zA-Z]{2}_[a-zA-Z]{2}(-[a-zA-Z0-9]{2,3})?__[0-9]{6,8}(?:\\\
            +[A-Z0-9]{3})*(?:_[A-Z0-9]+)?(_[0-9A-Z]{3,4})?__(((([a-zA-Z0-9]{1,2}(-[a-zA-Z0-9#]{1,10})+)){1})(_([a-zA-Z0-9]{1,2}(-[a-zA-Z0-9#]{1,10})+)){0,})$"
          type: string
      description: |-
        The vehicleId of the vehicle e.g. {
          "vehicleId": "de_DE__1770871__AJ-050_AU-001_GC-411_LE-L_LU-696_MJ-800_PC-U62_PS-012#-M01#_SA-02B-08U-09U-243-258-270-294-345-351-362-440-475-485-504-543-545-580-58U-620-70B-79B-7U1-927-936-961-969-B18-B59-L3A-R00-R05-U01-U10-U54-U60_SC-084-085-0B2-189-1B3-1U5-2U1-2U8-51B-6P5-8U6-8U8-98B-998-B09-B10-K13-K31-PXV-V08"
        }
    ApiError:
      type: object
      properties:
        type:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: object
        atomicDetails:
          type: object
          additionalProperties:
            type: object
        traceId:
          type: string
    Message:
      required:
      - message
      - priority
      - type
      type: object
      properties:
        type:
          $ref: "#/components/schemas/MessageType"
        message:
          type: string
        priority:
          $ref: "#/components/schemas/Priority"
    MessageType:
      type: string
      enum:
      - UNKNOWN_CODE_TYPES
      - OTHER
    OnlineCodeResponse:
      required:
      - onlineCode
      type: object
      properties:
        onlineCode:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
    Priority:
      type: string
      enum:
      - WARNING
      - INFO
    ActiveDriveCycle:
      type: string
      enum:
      - WLTP
      - NEDC
      - CH
      - LEGACY
    Amount:
      type: object
      properties:
        value:
          type: number
        unit:
          type: string
        alternatives:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Amount"
    Axles:
      type: object
      properties:
        axleNumber:
          type: integer
          format: int32
        permissibleWeightTotal:
          $ref: "#/components/schemas/Amount"
        permissibleWeightAxleFront:
          $ref: "#/components/schemas/Amount"
        permissibleWeightAxleBack:
          $ref: "#/components/schemas/Amount"
        permissibleWeightSolo:
          $ref: "#/components/schemas/Amount"
        axleLoadDistributionFront:
          $ref: "#/components/schemas/Amount"
        axleLoadDistributionBack:
          $ref: "#/components/schemas/Amount"
        axialDistanceToFrontAxle:
          $ref: "#/components/schemas/Amount"
        axialDistanceToFrontAxleBasis:
          $ref: "#/components/schemas/Amount"
    AxlesSources:
      required:
      - axialDistanceToFrontAxle
      - axialDistanceToFrontAxleBasis
      - axleLoadDistributionBack
      - axleLoadDistributionFront
      - axleNumber
      - permissibleWeightAxleBack
      - permissibleWeightAxleFront
      - permissibleWeightSolo
      - permissibleWeightTotal
      type: object
      properties:
        axleNumber:
          type: array
          items:
            type: string
        permissibleWeightTotal:
          type: array
          items:
            type: string
        permissibleWeightAxleFront:
          type: array
          items:
            type: string
        permissibleWeightAxleBack:
          type: array
          items:
            type: string
        permissibleWeightSolo:
          type: array
          items:
            type: string
        axleLoadDistributionFront:
          type: array
          items:
            type: string
        axleLoadDistributionBack:
          type: array
          items:
            type: string
        axialDistanceToFrontAxle:
          type: array
          items:
            type: string
        axialDistanceToFrontAxleBasis:
          type: array
          items:
            type: string
    Brand:
      required:
      - name
      type: object
      properties:
        name:
          type: string
    CarTax:
      required:
      - co2tax
      - currency
      - engineCapacityTax
      - totalTax
      type: object
      properties:
        co2tax:
          type: number
          format: double
        engineCapacityTax:
          type: number
          format: double
        totalTax:
          type: integer
          format: int32
        currency:
          type: string
