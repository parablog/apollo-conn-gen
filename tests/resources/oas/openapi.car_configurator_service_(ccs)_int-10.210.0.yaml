  /api/v1/status:
    get:
      tags:
      - Status
      summary: "This is a static status endpoint, which can be used by consumers for\
        \ health checks."
      description: Get information about the current status of the REST API.
      operationId: statusBy
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /api/v1/onlinecode/{onlineCode}:
    get:
      tags:
      - Offering - Onlinecode
      summary: Get the configuration for the given onlineCode and restore the vehicle
        inclusive necessary healing.
      description: Get the VehicleConfiguration for the given `onlineCode`. You can
        use the optional query parameter `marketId` if CCS should throw an exception
        on mismatch.
      operationId: loadVehicleConfigurationWithOptionalMarketId
      parameters:
      - name: Login-State
        in: header
        required: false
        schema:
          type: string
          enum:
          - CUSTOMER
          - EMPLOYEE
      - name: onlineCode
        in: path
        description: OnlineCode string that identifies a vehicle configuration e.g.
          'M6882554'. This code is just an Example. **Please do not use it in the
          try out.**
        required: true
        schema:
          pattern: "[M,T]{1}[0-9A-Z]{7}"
          type: string
      - name: marketId
        in: query
        description: "Combination of language and country e.g 'de_DE', 'en_AE-AZ'\
          \ or 'en_PS-GZA'"
        required: false
        schema:
          pattern: "^[a-zA-Z]{2}_[a-zA-Z]{2}(-[a-zA-Z0-9]{2,3})?$"
          type: string
        example: de_DE
      - name: views
        in: query
        description: |-
          Specifies what kind of additional data should be returned. The data views are separated from each other by a comma.

          |parameter|Description|
          |---|---|
          |TECH|Data view of technical information of a vehicle|
          |MEDIA|Media (images) view for configuration|
          |CATEGORIES|Adds the configuration categories of all selected components|
          |MULTI_DESC|View with detailed component descriptions|
