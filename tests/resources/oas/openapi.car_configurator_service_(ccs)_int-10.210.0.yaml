          |---|---|
          |INTERNET|Show configurations available on the internet (default)|
          |RETAIL|Show configurations available for retailers only|
          |WHOLESALE|Show configurations available for wholesalers only|
        required: false
        schema:
          type: string
          enum:
          - INTERNET
          - RETAIL
          - WHOLESALE
      - name: checkBuildability
        in: query
        description: Check if the alternative is buildable by the kernel. Currently
          only available for Vans (KBV).
        required: false
