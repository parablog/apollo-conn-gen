  /api/v1/markets/{marketId}/dataversion/{dataversion}/models:
    get:
      tags:
      - Offering - Portfolio-Data (with Dataversion)
      summary: Get all available models for the given marketId and dataversion.
      description: "Get all available VehicleModels for the given `marketId` and `dataversion`.\
        \ The optional query parameters `classId`, `bodyId`, `baumuster4prefix`, `baumuster`,\
        \ `nationalSalesType` or `productGroups` may be used to filter the result.\
        \ <br/> <br/>The parameter `baumuster4prefix` must conform to the pattern\
        \ [0-9]{4}."
      operationId: getVehicleModelsForMarket_1
      parameters:
      - name: marketId
        in: path
        description: "Combination of language and country e.g 'de_DE', 'en_AE-AZ'\
          \ or 'en_PS-GZA'"
        required: true
        schema:
          pattern: "^[a-zA-Z]{2}_[a-zA-Z]{2}(-[a-zA-Z0-9]{2,3})?$"
          type: string
        example: de_DE
      - name: dataversion
        in: path
        description: "This is 8 character SHA string e.g. '22411c83' and a name e.g.\
          \ 'Anlauf AMG GT-Roadster (R190), neuer Fahrzeugtyp für C190 V2016.47 Fri\
          \ Jun 30 00:00:00 CEST 2017' to identify a loaded data version."
        required: true
        schema:
          type: string
        example: 1
      - name: classId
        in: query
        description: This is a class id e.g. 'A-KLASSE' for 'A-Klasse' in Germany.
        required: false
        schema:
          pattern: "[A-Z][0-9]{2}|[0-9]{3}|[-_A-Z]+[ ]{0,1}[-_A-Z]*"
          type: string
      - name: bodyId
        in: query
        description: This is a body id e.g. 'KOMPAKT-LIMOUSINE' for 'Kompakt-Limousine'
          in Germany.
        required: false
        schema:
          pattern: "[0-9]{1,3}|[0-9]{0,1}[-_A-Z]+[ ]{0,1}[-_A-Z]*"
          type: string
      - name: baumuster4prefix
        in: query
        description: The first four digits of a baumuster are called baumuster4prefix
          e.g. '1770' for 'Berline' in France.
        required: false
        schema:
          pattern: "[0-9]{4}"
          type: string
      - name: baumuster
        in: query
        description: This is a baumuster e.g. '1770871' for 'A 200 Limousine' in Germany.
        required: false
        schema:
          pattern: "[0-9]{6,8}(?:\\+[A-Z0-9]{3})*(?:_[A-Z0-9]+)?"
          type: string
      - name: nationalSalesType
        in: query
        description: This is the national sales type of a distinct baumuster e.g.
          'E07' in France.
        required: false
        schema:
          pattern: "[0-9A-Z]{3,4}"
          type: string
      - name: productGroups
        in: query
        description: Specifies to which product groups the vehicles belong which should
          be returned. The product groups are separated from each other by a comma.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PKW
            - VAN
            - GELAENDEWAGEN
      - name: customerGroup
        in: query
        description: Specifies to which customer group the vehicles belong which should
          be returned.
        required: false
        schema:
          type: string
          enum:
          - COMMERCIAL
          - PRIVATE
      - name: views
        in: query
        description: |-
          Specifies what kind of additional data should be returned. The data views are separated from each other by a comma.

          |parameter|Description|
          |---|---|
          |TECH_REDUCED|Data view of reduced technical information of a vehicle|
          |CONFIDENTIAL|Data view to fetch confidential vehicles based on configuration date - [View More](https://pages.git.i.mercedes-benz.com/CarConfigurator/CarIM/faq/)|
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - TECH_REDUCED
            - CONFIDENTIAL
      - name: configurationDate
        in: query
        description: "Specifies the date on which a configuration has to be valid\
          \ (format: 'YYYY-MM-DD', e.g. '2024-02-14'). Attention: date is treated\
          \ as UTC date."
        required: false
        schema:
          type: string
          format: date
      - name: pricingDate
        in: query
        description: "Specifies the pricing date of the configuration (format: 'YYYY-MM-DD',\
          \ e.g. '2024-02-14'). Attention: date is treated as UTC date."
        required: false
        schema:
          type: string
          format: date
      - name: overrideSystemDate
        in: query
        description: "Specifies the virtual system date for KBV based vehicles (format:\
          \ 'YYYY-MM-DD', e.g. '2023-02-14'). Attention: date is treated as UTC date.\
          \ Only available when using CONFIDENTIAL view and corresponding access rights."
        required: false
        schema:
          type: string
          format: date
      - name: salesLevel
        in: query
        description: |
          Restricts the configurations to a certain sales level.

          |parameter|Description|
          |---|---|
          |INTERNET|Show configurations available on the internet (default)|
          |RETAIL|Show configurations available for retailers only|
          |WHOLESALE|Show configurations available for wholesalers only|
        required: false
        schema:
          type: string
          enum:
          - INTERNET
          - RETAIL
          - WHOLESALE
      - name: zipCode
        in: query
        description: The zip code is needed in Australia (e.g. 2000) and Malaysia
          (e.g. 50000) to calculate taxes and prices.
        required: false
        schema:
          pattern: "[0-9]{2,}"
          type: string
      responses:
        "301":
          description: Dataversion has not been found
        "403":
          description: Access is forbidden for requested market or sales level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: A system error has occurred. Details can be found in the error
            message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Market not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: MarketId is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleModel"
