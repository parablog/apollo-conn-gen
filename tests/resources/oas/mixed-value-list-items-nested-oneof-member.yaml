openapi: 3.0.0
info:
  title: a list item oneOf whose object-shaped member is itself a nested oneOf (excluded)
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /values.list:
    get:
      operationId: listValues
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: object
                          oneOf:
                            - type: object
                              title: ById
                              properties:
                                id:
                                  type: string
                            - type: object
                              title: ByName
                              properties:
                                name:
                                  type: string
