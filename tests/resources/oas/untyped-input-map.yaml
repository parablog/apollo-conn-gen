openapi: 3.0.3
info:
  title: Untyped input map
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /widgets:
    post:
      operationId: createWidget
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  # no `type` key: reaches fromProp's untyped branch (factory.ts, A8)
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
