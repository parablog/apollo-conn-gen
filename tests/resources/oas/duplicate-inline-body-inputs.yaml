# An inline object body and a oneOf body in one selection, as github's write ops and
# patch:/gists/{gist_id} ship them — both wrote `input InputInput`.
openapi: 3.0.3
info:
  title: Duplicate inline body inputs
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  # /docs visits first (path order), so its object body claims `Input` and the union renames
  /docs:
    post:
      operationId: createDoc
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
  /notes:
    post:
      operationId: createNote
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    title:
                      type: string
                - type: object
                  properties:
                    url:
                      type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
components:
  schemas:
    Ack:
      type: object
      properties:
        ok:
          type: boolean
