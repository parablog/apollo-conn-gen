openapi: 3.0.0
info:
  title: anyOf of only plain scalars, property position
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /thing:
    get:
      operationId: getThing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  score:
                    anyOf:
                      - type: string
                      - type: number
