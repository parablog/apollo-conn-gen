openapi: 3.0.3
info:
  title: Only field in a cycle
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /history:
    get:
      operationId: getHistory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
    post:
      operationId: addHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/History'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
  /box:
    get:
      operationId: getBox
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Box'
components:
  schemas:
    History:
      type: object
      properties:
        contributors:
          $ref: '#/components/schemas/Contributors'
        createdDate:
          type: string
        # a list (or map) of a type whose every field is left out still named that same type -> a
        # dangling SDL reference, composition failed with "cannot find type"  #201
        contributorGroups:
          type: array
          items: { $ref: '#/components/schemas/Contributors' }
        contributorsByKey:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Contributors' }
    # the only field re-enters History, so it is removed to break the loop and nothing real is
    # left — as in confluence's ContentHistory.contributors -> Contributors { publishers }
    Contributors:
      type: object
      properties:
        publishers:
          $ref: '#/components/schemas/History'
    # an object declaring no properties of its own, distinct from a shapeless `{}` value: this
    # one still has `type: object`, it just lists nothing to put inside it
    Box:
      type: object
      properties:
        emptyBox:
          type: object
          properties: {}
