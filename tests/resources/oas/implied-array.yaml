openapi: 3.0.3
info:
  title: Implied Array Service
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /things:
    get:
      operationId: listThings
      # Response schema has `items` but no explicit `type: array` -> implied array of Thing.
      responses:
        '200':
          description: A list of things
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Thing'
components:
  schemas:
    Thing:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
