openapi: 3.0.3
info:
  title: R159 Skip Arg Defaults Service
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  # limit/page_size/sort/q each declare a default the flag turns into the "Params:" note; sort
  # and region also list allowed values, and region's ten pin the note's eight-value cap.
  # verbose, unconstrained, pins that such a parameter stays out of the note
  /items:
    get:
      operationId: listItems
      summary: List items
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: page_size
          in: query
          schema: { type: integer, default: 10 }
        - name: sort
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: q
          in: query
          schema: { type: string, default: '' }
        - name: region
          in: query
          schema:
            type: string
            enum: [na, sa, eu, af, me, sas, eas, sea, oc, an]
        - name: verbose
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: A list of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  # a lone unconstrained path parameter pins that the operation keeps its plain description
  # under the flag
  /items/{item_id}:
    get:
      operationId: getItem
      summary: Get an item by id
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A single item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
components:
  schemas:
    Item:
      type: object
      properties:
        item_id:
          type: string
        name:
          type: string
