openapi: 3.0.0
info:
  title: oneOf plain values on a property
  version: 1.0.0
paths:
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
components:
  schemas:
    Widget:
      type: object
      properties:
        kind:
          oneOf:
            - type: string
              enum: [alpha, beta, gamma]
            - type: string
              description: "custom kind"
