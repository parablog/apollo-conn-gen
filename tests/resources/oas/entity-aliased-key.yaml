openapi: 3.0.3
info:
  title: Aliased Key Service
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List all widgets
      responses:
        '200':
          description: A list of widgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Widget'
  /widgets/{widget_id}:
    get:
      operationId: getWidget
      summary: Get a widget by id
      parameters:
        - name: widget_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A single widget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
components:
  schemas:
    Widget:
      type: object
      # widget_id is optional and needs sanitising (widgetId: widget_id) — pins the #16
      # by-identity key suppression on an aliased key
      properties:
        widget_id:
          type: string
        name:
          type: string
