openapi: 3.0.0
info:
  title: Doc pagination
  version: 1.0.0
servers:
  - url: http://localhost:9000
paths:
  /items:
    get:
      operationId: listItems
      summary: List items
      parameters:
        - name: page_index
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: page_limit
          in: query
          schema: { type: integer, default: 5, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: a page of items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
  /events:
    get:
      operationId: listEvents
      summary: List events
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: a page of events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
  /pages:
    get:
      operationId: listPages
      summary: List pages of the document
      # no pagination parameters: "pages" in the path/name alone must not trigger the note
      responses:
        '200':
          description: every page
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
  /items/{item_id}:
    get:
      operationId: getItem
      summary: Get an item
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: one item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
components:
  schemas:
    Item:
      type: object
      properties:
        item_id: { type: integer }
        name: { type: string }
