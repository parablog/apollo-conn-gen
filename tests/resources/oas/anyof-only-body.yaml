openapi: 3.0.0
info:
  title: A request body whose schema is an anyOf with no oneOf
  version: 1.0.0
paths:
  # The body lists its variants under `anyOf` and never under `oneOf` (digitalocean
  # `post:/v2/domains/{domain_name}/records`, one member per DNS record type). The members must be
  # read from whichever keyword carries them, or the body is written with no fields at all.
  # see docs/FIXED.md #50
  /records:
    post:
      operationId: createRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  required: [type, name]
                  properties:
                    type:
                      type: string
                    name:
                      type: string
                - type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                    priority:
                      type: integer
      responses:
        '200':
          description: The created record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
