openapi: 3.0.0
info:
  title: mixed oneOf as items of a list of lists (excluded position)
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /values.list:
    get:
      operationId: listValues
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      type: array
                      items:
                        oneOf:
                          - type: boolean
                            title: Boolean
                          - type: object
                            title: Currency
                            properties:
                              value:
                                type: number
                              currencyCode:
                                type: string
                          - type: string
                            title: Date
                            format: date-time
