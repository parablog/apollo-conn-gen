openapi: 3.1.0
info:
  title: A spec with both a path and a webhook
  version: 1.0.0
paths:
  /ping:
    get:
      operationId: ping
      responses:
        '200':
          description: A pong.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
# A webhook sits outside `paths:`. We only read the paths, so this one is skipped. see #53
webhooks:
  petCreated:
    post:
      operationId: petCreated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
      responses:
        '200':
          description: Acknowledged.
