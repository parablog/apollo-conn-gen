openapi: 3.0.0
info:
  title: Inline allOf property collides with a same-class real component (#126)
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  # Notes.user is an inline 2-member allOf under a property literally named "user" — Composed.updateName
  # mints it "User" (#7), the same name as the real, unrelated User component below. Both are Composed
  # (same node class), so collidesAcrossNodeClasses (#22) never fires for this pair.
  /notes:
    get:
      operationId: getNotes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notes'
  /users:
    get:
      operationId: getUsers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    Notes:
      type: object
      properties:
        id:
          type: string
        user:
          allOf:
            - type: object
              properties:
                id:
                  type: string
            - type: object
              properties:
                role:
                  type: string
    User:
      allOf:
        - type: object
          properties:
            name:
              type: string
        - type: object
          properties:
            email:
              type: string
