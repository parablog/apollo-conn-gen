openapi: 3.0.3
info:
  title: AnyOf Param Service
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /things/{id}:
    get:
      operationId: getThing
      parameters:
        # path param typed as anyOf (int | string) — has no single arg type; coerce to String
        - name: id
          in: path
          required: true
          schema:
            anyOf:
              - type: integer
              - type: string
      responses:
        '200':
          description: A thing
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
