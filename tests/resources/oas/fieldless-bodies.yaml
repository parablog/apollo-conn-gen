openapi: 3.0.3
info:
  title: Fieldless bodies
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /notes:
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
  /empty:
    post:
      operationId: createEmpty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
  /free:
    post:
      operationId: createFree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
components:
  schemas:
    Result:
      type: object
      properties:
        ok:
          type: boolean
