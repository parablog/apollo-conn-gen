openapi: 3.0.0
info:
  title: coalesce-only floor probe
  version: 1.0.0
servers:
  - url: https://example.com
paths:
  /release:
    get:
      operationId: getRelease
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - tag
                properties:
                  name:
                    type: string
                  # both fields required, no maps: `??` is the only pre-2.15 syntax this spec
                  # emits, isolating it from the unrelated map/`?`-marker floors. see docs/FIXED.md #163
                  tag:
                    type: string
                    default: latest
