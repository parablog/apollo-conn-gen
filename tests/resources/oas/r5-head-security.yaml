openapi: 3.0.3
info:
  title: Head Security Service
  version: 1.0.0
servers:
  - url: https://api.example.com
# Global bearer. Only the HEAD op declares its own security — but HEAD isn't emitted (the
# generator handles only get/post/put/patch/delete), so hasPerOperationSecurity must ignore it
# and the spec stays in uniform mode: the bearer header lives on @source, not per-@connect.
security:
  - bearerAuth: []
paths:
  /things:
    get:
      operationId: listThings
      summary: List all things
      responses:
        '200':
          description: A list of things
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Thing'
    head:
      operationId: headThings
      security:
        - headOnlyAuth: []
      responses:
        '200':
          description: Headers only
components:
  schemas:
    Thing:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    headOnlyAuth:
      type: apiKey
      in: header
      name: X-Head-Only
