openapi: 3.0.0
info:
  title: A write whose response object has no fields, alongside a body that has some
  version: 1.0.0
paths:
  # The answer carries an object with no properties (asana's "success is the status code"
  # convention, `post:/goals/{goal_gid}/removeSupportingRelationship`). The body IS selectable, so
  # asking whether the whole op has anything to select never fires the free-form-JSON fallback for
  # the response — it has to be asked per side. see docs/FIXED.md #51
  /goals/{goalId}/removeSupportingRelationship:
    post:
      operationId: removeSupportingRelationship
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/RemoveRequest'
      responses:
        '200':
          description: An empty object on success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmptyResponse'
components:
  schemas:
    RemoveRequest:
      type: object
      properties:
        supportingResource:
          type: string
    EmptyResponse:
      description: An empty object. Some endpoints do not return an object on success.
      type: object
