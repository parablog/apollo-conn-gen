openapi: 3.1.0
info:
  title: anyOf [$ref, null] property
  version: 1.0.0
# see docs/FIXED.md #177
# OAS 3.1's nullable-reference spelling: `anyOf: [$ref X, {type: 'null'}]`. Stainless-generated
# specs (profound.yaml's PromptUpdatePreview.tags) use this for nearly every optional object
# field. The null arm is stripped by #60, leaving a one-member anyOf that fromProp never read,
# so the field fell through to JSON.
servers:
  - url: https://example.com
paths:
  /previews/{id}:
    get:
      operationId: getPreview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptUpdatePreview"
components:
  schemas:
    PromptUpdatePreview:
      type: object
      required:
        - id
        - tags
      properties:
        id:
          type: string
        tags:
          anyOf:
            - $ref: "#/components/schemas/NamedResourceDiffList"
            - type: "null"
        prompt:
          anyOf:
            - $ref: "#/components/schemas/NamedResourceDiffList"
            - type: "null"
    NamedResourceDiffList:
      type: object
      properties:
        added:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string
