openapi: 3.0.0
info:
  title: a required list of lists
  version: 1.0.0
# see docs/FIXED.md #59
# The `!` for a required field is written after the value. A list of lists of scalars writes its own
# line ending first, so the `!` lands alone on the next line. Harmless to the parser (line breaks
# are ignored) but wrong to the eye — and to any tool comparing schemas line by line.
servers:
  - url: https://example.com
paths:
  /matrix:
    get:
      operationId: getMatrix
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required:
                  - processes
                properties:
                  titles:
                    type: array
                    items:
                      type: string
                  processes:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
                  # the same nesting over objects (box's `name_conflicts`): the field must name the
                  # type at the bottom, and the selection must open one block for it
                  rows:
                    type: array
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: string
