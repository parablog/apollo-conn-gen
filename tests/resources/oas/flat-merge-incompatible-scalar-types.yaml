openapi: 3.0.0
info:
  title: a flat merge (no plain-value member) whose two objects disagree on a scalar field's GraphQL type
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /party.get:
    get:
      operationId: getParty
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  party:
                    oneOf:
                      - type: object
                        title: Individual
                        properties:
                          status:
                            type: string
                      - type: object
                        title: Organization
                        properties:
                          status:
                            type: integer
