openapi: 3.0.0
info:
  title: Entity auth
  version: 1.0.0
servers:
  - url: http://localhost:9000
paths:
  /items:
    get:
      operationId: listItems
      summary: List items
      # no security: with the by-id op below declaring its own, the spec is in per-op mode
      responses:
        '200':
          description: items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
  /items/{item_id}:
    get:
      operationId: getItem
      summary: Get an item
      security:
        - bearerAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: one item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Item:
      type: object
      properties:
        item_id: { type: integer }
        name: { type: string }
