# Query to retrieve vehicle models available for a specific market
# This query fetches comprehensive model information including pricing, specifications, and validation status
query GetModelsForMarket($marketId: String!) {
  marketModels(marketId: $marketId) {
    allTerrain
    baumuster
    baumuster6
    baureihe
    changeYear
    dataSupply
    driveType
    facelift
    faceliftNumber
    internalModelSeries
    lifeCycle
    modelId
    modelType
    modelYear
    motorizationType
    name
    nationalSalesType
    productDivision
    productGroup
    shortName
    typeClass
    vanTypeCode
    vehicleSortId
    brand {
      name
    }
    line {
      description
      name
    }
    modelCodes {
      modelCode
      salesReference
    }
    offerInformation {
      offerClassification
    }
    priceInformation {
      currency
      discounts {
        bonus
        id
        name
        netBonus
      }
      instalmentPrice
      netPrice
      price
      taxes {
        amount
        baseAmount
        charge
        id
        rate
        rateInPercentage
        sortId
        taxCode
      }
    }
    productStructure {
      id
      name
    }
    sizeClass {
      sizeClassId
      sizeClassName
    }
    validationStatus {
      valid
    }
    vehicleBody {
      bodyId
      bodyName
    }
    vehicleClass {
      classId
      className
    }
    wheelbase {
      unit
      value
    }
  }
} 